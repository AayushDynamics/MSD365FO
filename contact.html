<meta name="twitter:card" content="summary">

<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-bar">
    <a class="site-title-link" href="index.html">
      <div class="grid-icon"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div>
      <span class="site-title">MS D365 F&O</span>
      <span class="site-sub">| Exploring D365 Finance and Operations</span>
    </a>
    <div class="spacer"></div>
    <div class="avatar">AT</div>
  </div>

  <div class="shell">
    <div class="nav-pane">
      <div class="nav-pane-inner">
        <div class="nav-section-label">SITE</div>
        <a class="nav-item" href="index.html">Home</a>
        <a class="nav-item" href="about.html">About</a>
        <a class="nav-item active" href="contact.html">Contact</a>
      </div>
    </div>

    <div class="main narrow">
      <div class="breadcrumb"><a href="index.html">MS D365 F&O</a><span class="sep">›</span>Contact</div>
      <h1 class="page-title">Contact</h1>
      <p class="page-subtitle">Get in touch</p>

      <div class="command-bar">
        <div class="cmd-btn"><span class="cmd-icon">✉</span><span class="cmd-label">New message</span></div>
      </div>

      <div class="form-panel">
        <!-- Paste your Formspree form ID into the action attribute below -->
        <form id="contactForm" action="https://formspree.io/f/xbgjnbvl" method="POST">
          <div class="form-row">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" autocomplete="name" required>
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="email" required>
          </div>
          <div class="form-row">
            <label for="message">Message</label>
            <textarea id="message" name="message" required></textarea>
          </div>

          <input type="hidden" name="_subject" value="New message from MS D365 F&O">
          <!-- Spam honeypot: real people never fill this in -->
          <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" aria-hidden="true" class="hidden">

          <button type="submit" class="form-submit" id="contactSubmit">Send message</button>
          <p id="formStatus" role="status" aria-live="polite" style="margin-top:12px;font-size:12px;color:var(--text-secondary);"></p>
        </form>
      </div>
    </div>
  </div>

<script src="script.js"></script>
</body>
</html>
