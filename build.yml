name: Build blog posts

on:
  push:
    branches: [main]
    paths:
      - 'content/posts/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate post pages and update homepage
        run: node scripts/build-posts.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ index.html
          git diff --staged --quiet || git commit -m "Auto-build: regenerate posts from CMS content [skip ci]"
          git push
